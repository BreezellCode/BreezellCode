<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chat Mirror</title>
	<link rel="stylesheet" href="style.css">
	<!-- Breezell's bridge: window.breezell.postMessage / onMessage / connected -->
	<script src="/__breezell/api.js"></script>
</head>
<body>
	<aside>
		<header>
			<span class="brand">Conversations</span>
			<button class="ghost" id="refresh" title="Refresh">Refresh</button>
		</header>
		<button class="new" id="new">New conversation</button>
		<ul id="list" aria-label="Conversations"></ul>
	</aside>

	<main>
		<header>
			<div class="title">
				<span id="title">Pick a conversation</span>
				<span class="activity" id="activity"></span>
			</div>
			<button class="ghost" id="show" disabled>Open in Breezell</button>
		</header>

		<div class="error" id="error" hidden></div>
		<section id="messages" aria-live="polite"></section>

		<form id="composer">
			<textarea id="text" rows="3" placeholder="Message (Ctrl+Enter to send)"></textarea>
			<div class="bar">
				<label class="model" id="modelBox" hidden title="Breezell's chat model: switching it here switches it in Breezell too">
					<span>Model</span>
					<select id="model" disabled></select>
				</label>
				<button class="primary" id="send" type="submit">Send</button>
			</div>
		</form>
	</main>

	<script src="app.js"></script>
</body>
</html>
