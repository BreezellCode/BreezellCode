<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Activity Island</title>
<link rel="stylesheet" href="island.css">
<script src="/__breezell/api.js"></script>
</head>
<body class="overlay" data-look="dark">
	<div id="island">
		<div id="capsule" role="button">
			<div id="rest"><span class="dot-mark" aria-hidden="true"></span><span id="title"></span></div>
			<div id="live"></div>
			<div id="panel" aria-hidden="true">
				<div id="panel-content">
					<div id="panel-head">
						<span id="panel-glyph" class="glyph"></span>
						<span id="panel-summary"></span>
						<button id="panel-back" type="button"></button>
					</div>
					<div id="panel-body"></div>
					<div id="panel-hint"></div>
				</div>
			</div>
		</div>
		<div id="bubble"></div>
	</div>
	<script src="overlay.js"></script>
</body>
</html>
